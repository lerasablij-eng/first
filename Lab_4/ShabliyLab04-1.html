
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Ненумеровані списки</title>
</head>
<body>

    <h1>Види ненумерованих списків</h1>

    <h3>1. Маркер — замальований кружок</h3>
    <ul type="disc">
        <li>Інформатика</li>
        <li>Математика</li>
        <li>Історія</li>
        <li>Англійська мова</li>
    </ul>

    <h3>2. Маркер — незамальований кружок</h3>
    <ul type="circle">
        <li>Читання</li>
        <li>Малювання</li>
        <li>Музика</li>
        <li>Спорт</li>
    </ul>

    <h3>3. Маркер — замальований квадратик</h3>
    <ul type="square">
        <li>Комп'ютер</li>
        <li>Клавіатура</li>
        <li>Монітор</li>
        <li>Миша</li>
    </ul>

</body>
</html>
