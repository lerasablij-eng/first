
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Горизонтальні рядки, що біжать</title>
</head>
<body style="background-color: #f0f8ff; font-family: Verdana, sans-serif;">

    <h1 align="center">Горизонтальні рядки, що біжать</h1>

    <marquee direction="left" behavior="alternate"
        height="50" bgcolor="#ffb6c1" scrollamount="6">
        <font color="#800000" size="4">
            <b>Навчання відкриває нові можливості!</b>
        </font>
    </marquee>

    <br>

    <marquee direction="left" behavior="scroll"
        height="50" bgcolor="#b0e0e6" scrollamount="5">
        <font color="#000080" size="4">
            Читай, досліджуй та відкривай нове!
        </font>
    </marquee>

    <br>

    <marquee direction="right" behavior="slide"
        height="50" bgcolor="#98fb98" scrollamount="5">
        <font color="#006400" size="4">
            Успіх починається з маленьких кроків!
        </font>
    </marquee>

    <br>

    <marquee direction="left" behavior="scroll"
        height="50" scrolldelay="50" scrollamount="6"
        bgcolor="#ffe4b5">
        <font color="#8b4513" size="4">
            Працюй уважно та досягай мети!
        </font>
    </marquee>

    <br>

    <marquee direction="right" behavior="scroll"
        height="50" scrolldelay="150" scrollamount="6"
        bgcolor="#d8bfd8">
        <font color="#4b0082" size="4">
            Кожен день — це новий досвід!
        </font>
    </marquee>

</body>
</html>
