<FONT COLOR="#008080" SIZE="7"><B>
Моя група та друзі
</B></FONT>

<BR><BR>

<FONT SIZE="5">
Моя група — це люди, з якими я навчаюся.
<BR>
Разом ми виконуємо навчальні завдання,
спілкуємося та допомагаємо один одному.
<BR><BR>
У мене є хороші друзі, з якими цікаво
проводити час і спілкуватися.
</FONT>
