
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Таблиця з оформленням</title>
</head>

<body>

<table align="right"
       width="600"
       border="5"
       cellpadding="10"
       cellspacing="3"
       bgcolor="#CCFFFF"
       style="border: 5px double #333399;">

    <caption>Моя навчальна таблиця</caption>

    <tr>
        <th>№</th>
        <th>Предмет</th>
        <th>Викладач</th>
        <th>Аудиторія</th>
    </tr>

    <tr>
        <td>1</td>
        <td>Інформатика</td>
        <td>Іваненко</td>
        <td>101</td>
    </tr>

    <tr>
        <td>2</td>
        <td>Математика</td>
        <td>Петренко</td>
        <td>205</td>
    </tr>

    <tr>
        <td>3</td>
        <td>Англійська мова</td>
        <td>Коваленко</td>
        <td>12</td>
    </tr>

    <tr>
        <td>4</td>
        <td>Фізика</td>
        <td>Шевченко</td>
        <td>303</td>
    </tr>

</table>

</body>
</html>
