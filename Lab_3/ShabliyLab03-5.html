
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Таблиця з об'єднаними комірками</title>
</head>

<body>

<table border="1" width="80%" cellpadding="10" cellspacing="0"
       style="border-collapse: collapse; text-align: center; margin: auto;">

    <caption>Навчальна таблиця</caption>

    <tr>
        <td colspan="2" rowspan="2" style="vertical-align: middle;">
            Об'єднана комірка
        </td>
        <th colspan="2">Предмети</th>
        <th rowspan="2" style="vertical-align: middle;">Оцінка</th>
    </tr>

    <tr>
        <th>Основні</th>
        <th>Додаткові</th>
    </tr>

    <tr>
        <th rowspan="2" style="vertical-align: middle;">Студент 1</th>
        <td>Інформатика</td>
        <td>Математика</td>
        <td>Англійська</td>
        <td>12</td>
    </tr>

    <tr>
        <td colspan="2" rowspan="2" style="vertical-align: middle;">
            Практичні заняття
        </td>
        <td>Фізика</td>
        <td>10</td>
    </tr>

    <tr>
        <th>Студент 2</th>
        <td>Історія</td>
        <td>11</td>
    </tr>

</table>

</body>
</html>
