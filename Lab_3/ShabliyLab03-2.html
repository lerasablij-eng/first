
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Складна таблиця</title>
</head>

<body>

<table border="1" cellpadding="5" cellspacing="0">

    <tr>
        <td colspan="2" rowspan="2">&nbsp;</td>
        <th colspan="2">Характеристики</th>
    </tr>

    <tr>
        <th>Середній зріст, см</th>
        <th>Середня вага, кг</th>
    </tr>

    <tr align="center">
        <th rowspan="2">Стать</th>
        <td>Чоловіча</td>
        <td>177</td>
        <td>73</td>
    </tr>

    <tr align="center">
        <td>Жіноча</td>
        <td>166</td>
        <td>65</td>
    </tr>
</table>

</body>
</html>
