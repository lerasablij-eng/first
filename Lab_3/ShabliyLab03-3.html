
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Таблиця шириною 75%</title>
</head>

<body>

<table width="75%" border="1" cellspacing="3" cellpadding="10" align="center">

    <caption>
        <b>Навчальна таблиця</b>
    </caption>

    <tr>
        <th colspan="2">Заголовок</th>
    </tr>

    <tr>
        <td align="left" width="25%">
            Дані, вирівняні по лівому краю комірки
        </td>

        <td align="right" width="75%">
            Дані, вирівняні по правому краю комірки
        </td>
    </tr>

</table>

</body>
</html>
